name: CI for a single Pimcore version

on:
  workflow_call:
    inputs:
      GITHUB_ENVIRONMENT:
        required: true
        type: string
        description: "The GitHub environment to use when pulling variables and secrets"
      SKELETON_REF:
        required: true
        type: string
        description: "The branch/ref of PROJECT_REPOSITORY to deploy"
      PARAMETERS_FILE:
        required: true
        type: string
        description: "The path to the parameters.json file to use when provisioning the Azure environment"
      SERVICE_PRINCIPAL_ID:
        required: true
        type: string
        description: "Azure Service Principal ID"
      PROJECT_REPOSITORY:
        required: false
        type: string
        default: TorqIT/pimcore-skeleton
        description: "The project repository to deploy, in owner/repo format"
      AGENT_SERVER:
        required: false
        type: boolean
        default: false
        description: "Whether PROJECT_REPOSITORY uses pimcore/pimcore-agent-bundle and its agent-server image should be built, pushed, and deployed"
    secrets:
      SERVICE_PRINCIPAL_PASSWORD:
        required: true
      PIMCORE_ENCRYPTION_SECRET:
        required: true
      PIMCORE_PRODUCT_KEY:
        required: true
      PIMCORE_INSTANCE_IDENTIFIER:
        required: true
      PIMCORE_ENTERPRISE_TOKEN:
        required: false
        description: (Optional) Needed to resolve private repo.pimcore.com packages, e.g. pimcore/pimcore-agent-bundle when AGENT_SERVER is true
      ANTHROPIC_API_KEY:
        required: false
        description: (Optional) Written into Key Vault as the "anthropic-api-key" secret when AGENT_SERVER is true
      OPEN_AI_AUTH_TOKEN:
        required: false
        description: (Optional) Written into Key Vault as the "open-ai-auth-token" secret when AGENT_SERVER is true
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

jobs:
  provision:
    name: Provision Azure environment
    uses: ./.github/workflows/provision-azure-environment.yml
    with:
      SERVICE_PRINCIPAL_ID: ${{ inputs.SERVICE_PRINCIPAL_ID }}
      ENVIRONMENT: ${{ inputs.GITHUB_ENVIRONMENT }}
      SKIP_IF_EXISTS: false
      PARAMETERS_FILE: ${{ inputs.PARAMETERS_FILE }}
      BUILD_IMAGE: true
    secrets:
      SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPEN_AI_AUTH_TOKEN: ${{ secrets.OPEN_AI_AUTH_TOKEN }}

  deploy-skeleton:
    name: Deploy Pimcore Skeleton to Azure Container Apps
    needs: [provision]
    uses: TorqIT/pimcore-github-actions-workflows/.github/workflows/deploy-to-azure-container-apps.yml@v7
    with:
      ENVIRONMENT: ${{ inputs.GITHUB_ENVIRONMENT }}
      PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
      PROJECT_REPOSITORY_REF: ${{ inputs.SKELETON_REF }}
      GITHUB_APP_CHECKOUT: true
      AGENT_SERVER: ${{ inputs.AGENT_SERVER }}
    secrets:
      SERVICE_PRINCIPAL_ID: ${{ inputs.SERVICE_PRINCIPAL_ID }}
      SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
      PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  post-url:
    name: Post Container App URL to PR
    needs: [deploy-skeleton]
    uses: ./.github/workflows/post-container-app-url-to-pr.yml
    with:
      ENVIRONMENT: ${{ inputs.GITHUB_ENVIRONMENT }}
      PARAMETERS_FILE: ${{ inputs.PARAMETERS_FILE }}
      SERVICE_PRINCIPAL_ID: ${{ inputs.SERVICE_PRINCIPAL_ID }}
      BUILD_IMAGE: true
    secrets:
      SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
