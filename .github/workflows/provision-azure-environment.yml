name: Provision Azure Environment for Pimcore

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
        description: "The GitHub environment to use for deployment"
      PARAMETERS_FILE:
        required: true
        type: string
        description: "Path to the parameters file containing the necessary parameters for provisioning the Azure environment"
      SERVICE_PRINCIPAL_ID:
        required: true
        type: string
        description: "Azure Service Principal ID with permissions to deploy resources to the target subscription and resource group"
      SKIP_IF_EXISTS:
        required: false
        type: boolean
        default: true
        description: "Whether to skip provisioning if the Azure environment already exists"
      BUILD_IMAGE:
        required: false
        type: boolean
        default: false
        description: "Whether to build the provisioning Docker image before starting the container. Will attempt to use Dockerfile at the root of the project."
      IMAGE_TAG:
        required: false
        type: string
        default: "2"
        description: "The tag to use for the provisioning image"
    secrets:
      SERVICE_PRINCIPAL_PASSWORD:
        required: true
        description: "Azure Service Principal password"
      PIMCORE_ENCRYPTION_SECRET:
        required: true
        description: "Secret value for Pimcore encryption, which will be stored in Azure Key Vault"
      PIMCORE_PRODUCT_KEY:
        required: true
        description: "Pimcore product key, which will be stored in Azure Key Vault"
      PIMCORE_INSTANCE_IDENTIFIER:
        required: true
        description: "Pimcore instance identifier, which will be stored in Azure Key Vault"
      ANTHROPIC_API_KEY:
        required: false
        description: "(Optional) Written into Key Vault as the 'anthropic-api-key' secret when the parameters file has provisionAgentServer set to true. Can't be randomly generated like the bundle's other secrets."
      OPEN_AI_AUTH_TOKEN:
        required: false
        description: "(Optional) Written into Key Vault as the 'open-ai-auth-token' secret when the parameters file has provisionAgentServer set to true. Can't be randomly generated like the bundle's other secrets."
      GH_APP_ID:
        required: false
        description: "(Optional) GitHub App ID used to check out TorqIT/ansible-playbooks when the parameters file has provisionServicesVM set to true"
      GH_APP_PRIVATE_KEY:
        required: false
        description: "(Optional) GitHub App private key used to check out TorqIT/ansible-playbooks when the parameters file has provisionServicesVM set to true"

jobs:
  provision-azure-env:
    name: Provision Azure environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1
        with:
          repository-name: TorqIT/pimcore-azure-provisioning
          file-name: provision-azure-environment.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TorqIT/pimcore-azure-provisioning
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Build and start container, and log in to Azure
        uses: ./reusable-workflow/.github/actions/build-start-and-login
        with:
          SERVICE_PRINCIPAL_ID: ${{ inputs.SERVICE_PRINCIPAL_ID }}
          SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
          PARAMETERS_FILE: ${{ inputs.PARAMETERS_FILE }}
          BUILD_IMAGE: "${{ inputs.BUILD_IMAGE }}"
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}

      # TODO this should ideally be a script in the container itself
      - name: Provision the Azure environment
        id: deploy
        run: |
          docker exec azure bash -c '
            set -e

            resourceGroup=$(jq -r ".parameters.resourceGroupName.value" parameters.json)

            if [ $(az group exists --name $resourceGroup) == 'true' ] &&
                [ ${{ inputs.SKIP_IF_EXISTS }} == 'true' ]; then
              echo "Resource Group $resourceGroup already exists, skipping provisioning as SKIP_IF_EXISTS is set to true."
            else
              echo "Creating Resource Group $resourceGroup..."
              location=$(jq -r ".parameters.location.value" parameters.json)
              az group create --name $resourceGroup --location $location

              echo "Creating Key Vault..."
              ./provisioning-scripts/provision-key-vault.sh parameters.json

              echo "Setting required Pimcore secrets in Key Vault..."
              keyVaultName=$(jq -r ".parameters.keyVaultName.value" parameters.json)
              keyVaultResourceGroupName=$(jq -r --arg RESOURCE_GROUP "$resourceGroup" ".parameters.keyVaultResourceGroupName.value // \$RESOURCE_GROUP" parameters.json)
              az keyvault network-rule add \
                --name $keyVaultName \
                --resource-group $keyVaultResourceGroupName \
                --ip-address $(curl ipinfo.io/ip)
              az keyvault secret set \
                --vault-name $keyVaultName \
                --name "pimcore-encryption-secret" \
                --value "${{ secrets.PIMCORE_ENCRYPTION_SECRET }}"
              az keyvault secret set \
                --vault-name $keyVaultName \
                --name "pimcore-product-key" \
                --value "${{ secrets.PIMCORE_PRODUCT_KEY }}"
              az keyvault secret set \
                --vault-name $keyVaultName \
                --name "pimcore-instance-identifier" \
                --value "${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}"
              az keyvault secret set \
                --vault-name $keyVaultName \
                --name "pimcore-admin-password" \
                --value "pimcore"
              if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
                az keyvault secret set \
                  --vault-name $keyVaultName \
                  --name "anthropic-api-key" \
                  --value "${{ secrets.ANTHROPIC_API_KEY }}"
              fi
              if [ -n "${{ secrets.OPEN_AI_AUTH_TOKEN }}" ]; then
                az keyvault secret set \
                  --vault-name $keyVaultName \
                  --name "open-ai-auth-token" \
                  --value "${{ secrets.OPEN_AI_AUTH_TOKEN }}"
              fi
              az keyvault network-rule remove \
                --name $keyVaultName \
                --resource-group $keyVaultResourceGroupName \
                --ip-address $(curl ipinfo.io/ip)

              ./provision.sh parameters.json
            fi
          '

      - name: Check whether the services VM is provisioned
        id: services-vm
        if: steps.deploy.outcome == 'success'
        run: |
          provisionServicesVm=$(jq -r '.parameters.provisionServicesVM.value // false' ${{ inputs.PARAMETERS_FILE }})
          echo "provisioned=$provisionServicesVm" >> "$GITHUB_OUTPUT"
          if [ "$provisionServicesVm" = "true" ]; then
            resourceGroup=$(jq -r '.parameters.resourceGroupName.value' ${{ inputs.PARAMETERS_FILE }})
            publicIp=$(docker exec azure az deployment group show \
              --resource-group $resourceGroup \
              --name main \
              --query "properties.outputs.servicesVmPublicIp.value" \
              --output tsv)
            echo "public-ip=$publicIp" >> "$GITHUB_OUTPUT"
            # Not every environment on the services VM wants agent-server (e.g. 2025.x/2026.x don't) -
            # only add it to that Ansible group when this environment's parameters actually ask for it.
            provisionAgentServer=$(jq -r '.parameters.provisionAgentServer.value // false' ${{ inputs.PARAMETERS_FILE }})
            echo "provision-agent-server=$provisionAgentServer" >> "$GITHUB_OUTPUT"
          fi

      # Mercure, OpenSearch and agent-server all run on the services VM instead of as Container Apps -
      # see ansible-playbooks' opensearch/mercure/pimcore_agent_server roles. Runs directly on the
      # runner (not inside the "azure" container) since Ansible needs an SSH client and a working
      # ansible-galaxy, neither of which play well with that container's minimal Azure Linux base.
      - name: Generate a token to check out ansible-playbooks
        id: ansible-playbooks-token
        if: steps.services-vm.outputs.provisioned == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: ansible

      - name: Checkout ansible-playbooks
        if: steps.services-vm.outputs.provisioned == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TorqIT/ansible
          token: ${{ steps.ansible-playbooks-token.outputs.token }}
          path: ansible-playbooks
          ref: feature/agent-server

      - name: Install Ansible
        if: steps.services-vm.outputs.provisioned == 'true'
        run: |
          # Pinned rather than latest - ansible-playbooks' roles predate ansible-core's stricter
          # (breaking) conditional-type checking introduced in newer releases.
          pip install --user "ansible-core>=2.16,<2.18"
          ansible-galaxy collection install -r ansible-playbooks/requirements.yml
          ansible-galaxy role install -r ansible-playbooks/requirements.yml

      - name: Configure services VM with Ansible
        if: steps.services-vm.outputs.provisioned == 'true'
        run: |
          set -e

          az login --tenant $(jq -r '.parameters.tenantId.value' ${{ inputs.PARAMETERS_FILE }}) \
            --service-principal \
              --username ${{ inputs.SERVICE_PRINCIPAL_ID }} \
              --password ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }} \
              --output none

          resourceGroup=$(jq -r '.parameters.resourceGroupName.value' ${{ inputs.PARAMETERS_FILE }})
          keyVaultName=$(jq -r '.parameters.keyVaultName.value' ${{ inputs.PARAMETERS_FILE }})
          keyVaultResourceGroupName=$(jq -r --arg RESOURCE_GROUP "$resourceGroup" '.parameters.keyVaultResourceGroupName.value // $RESOURCE_GROUP' ${{ inputs.PARAMETERS_FILE }})
          containerRegistryName=$(jq -r '.parameters.containerRegistryName.value' ${{ inputs.PARAMETERS_FILE }})
          phpContainerAppName=$(jq -r '.parameters.phpContainerAppName.value' ${{ inputs.PARAMETERS_FILE }})
          servicesVmName=$(jq -r '.parameters.servicesVmName.value' ${{ inputs.PARAMETERS_FILE }})
          servicesVmNsgName="${servicesVmName}-nsg"

          # The earlier "Provision the Azure environment" step already opened and closed this same
          # firewall for its own Key Vault calls - that window is long closed by the time this step
          # (a separate job step, possibly a different egress IP) runs, so open it again here. Same
          # idea for the services VM's NSG, which otherwise only allows SSH from
          # servicesVmFirewallIpsForSsh - GitHub-hosted runners don't have stable IPs, so that param
          # can't just list this runner ahead of time.
          runnerIp=$(curl -s ipinfo.io/ip)
          az keyvault network-rule add \
            --name $keyVaultName \
            --resource-group $keyVaultResourceGroupName \
            --ip-address $runnerIp \
            --output none
          az network nsg rule create \
            --resource-group $resourceGroup \
            --nsg-name $servicesVmNsgName \
            --name AllowCiRunnerSsh \
            --priority 100 \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --destination-port-ranges 22 \
            --source-address-prefixes $runnerIp \
            --output none
          trap '
            az keyvault network-rule remove --name $keyVaultName --resource-group $keyVaultResourceGroupName --ip-address $runnerIp --output none
            az network nsg rule delete --resource-group $resourceGroup --nsg-name $servicesVmNsgName --name AllowCiRunnerSsh --output none
          ' EXIT

          mkdir -p ~/.ssh
          az keyvault secret show --vault-name $keyVaultName --name services-vm-private-key --query value --output tsv > ~/.ssh/services-vm-key
          chmod 600 ~/.ssh/services-vm-key

          mercureJwtKey=$(az keyvault secret show --vault-name $keyVaultName --name mercure-jwt --query value --output tsv)
          agentServerAdminToken=$(az keyvault secret show --vault-name $keyVaultName --name agent-server-admin-token --query value --output tsv)
          anthropicApiKey=$(az keyvault secret show --vault-name $keyVaultName --name anthropic-api-key --query value --output tsv 2>/dev/null || echo "")
          openAiAuthToken=$(az keyvault secret show --vault-name $keyVaultName --name open-ai-auth-token --query value --output tsv 2>/dev/null || echo "")
          phpFqdn=$(az containerapp show --resource-group $resourceGroup --name $phpContainerAppName --query "properties.configuration.ingress.fqdn" --output tsv)
          # Short-lived token (docker login's well-known fixed username signals "token, not password"
          # to ACR) instead of the registry's admin user, which this repo deliberately leaves disabled.
          acrToken=$(az acr login --name $containerRegistryName --expose-token --output tsv --query accessToken)

          publicIp="${{ steps.services-vm.outputs.public-ip }}"
          cat > /tmp/inventory.ini <<EOF
          [opensearch]
          $publicIp

          [mercure]
          $publicIp

          [all:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=~/.ssh/services-vm-key
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          if [ "${{ steps.services-vm.outputs.provision-agent-server }}" = "true" ]; then
            cat >> /tmp/inventory.ini <<EOF
          [pimcore_agent_server]
          $publicIp
          EOF
          fi

          ~/.local/bin/ansible-playbook -i /tmp/inventory.ini ansible-playbooks/playbook.yml \
            --extra-vars "mercure_jwt_key=$mercureJwtKey" \
            --extra-vars "agent_server_admin_token=$agentServerAdminToken" \
            --extra-vars "anthropic_api_key=$anthropicApiKey" \
            --extra-vars "open_ai_auth_token=$openAiAuthToken" \
            --extra-vars "pimcore_internal_url=https://$phpFqdn" \
            --extra-vars "acr_registry_url=$containerRegistryName.azurecr.io" \
            --extra-vars "acr_username=00000000-0000-0000-0000-000000000000" \
            --extra-vars "acr_password=$acrToken"

      - name: Clean up Docker artifacts
        if: always()
        continue-on-error: true
        run: |
          docker rm -f azure
          docker image prune -af

      - name: Cancel Azure deployment if the deploy step failed or was cancelled
        if: always()
        continue-on-error: true
        run: |
          if [ ${{ steps.deploy.outcome }} == 'failure' ] || [ ${{ steps.deploy.outcome }} == 'cancelled' ]; then
            touch .env
            RESOURCE_GROUP=$(jq -r '.parameters.resourceGroupName.value' ${{ inputs.PARAMETERS_FILE }}) >> .env
            docker exec azure bash -c '
              az deployment group cancel \
                --resource-group $RESOURCE_GROUP \
                --name main
            '
          fi
